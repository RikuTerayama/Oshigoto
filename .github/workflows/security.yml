name: Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install audit tools
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4

      - name: Audit locked dependencies
        run: python -m pip_audit --no-deps --disable-pip -r requirements.lock.txt

      - name: Run Bandit
        run: bandit -q -lll -r app.py lib scripts -x static,templates,report

      - name: Run deterministic security preflight
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock.txt
          python scripts/security_preflight.py
