{% set a8_slot_placement = a8_slot_placement|default('global-footer-a8') %}
{% if selected_a8_creative and a8_can_render_placement(a8_slot_placement) %}
<section
    class="a8-creative-slot a8-creative-slot--{{ selected_a8_creative.responsive_mode|default('compact') }}"
    aria-label="PR・広告"
    data-a8-creative-id="{{ selected_a8_creative.id }}"
    data-affiliate-network="a8"
    data-affiliate-placement="{{ a8_slot_placement }}"
    data-a8-responsive-slot
    data-a8-responsive-mode="{{ selected_a8_creative.responsive_mode|default('compact') }}"
>
    <span class="a8-creative-slot__label">PR</span>
    <div class="a8-creative-slot__creative" data-a8-responsive-mount></div>
    <template data-a8-mobile-template data-a8-creative-id="{{ selected_a8_creative.id }}">
        {% include selected_a8_creative.template %}
    </template>
    {% if selected_a8_creative.desktop_variant %}
    <template data-a8-desktop-template data-a8-creative-id="{{ selected_a8_creative.desktop_variant.id }}">
        {% include selected_a8_creative.desktop_variant.template %}
    </template>
    {% endif %}
    <noscript><div class="a8-creative-slot__creative">{% include selected_a8_creative.template %}</div></noscript>
</section>
{% endif %}
